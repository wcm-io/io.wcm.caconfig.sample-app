# Context-Aware Configuration Sample Application

# Inherit default AEM functionality from "AEM Definitions", see http://devops.wcm.io/conga/definitions/aem/
inherits:
- role: aem-cms

variants:
- variant: aem-author
- variant: aem-publish

templateDir: sample-aem-cms

files:

# AEM OSGi System Configuration
- file: sample-aem-cms-config.osgiconfig.json
  dir: packages
  template: sample-aem-cms-config.osgiconfig.hbs
  postProcessors:
  - aem-contentpackage-osgiconfig
  postProcessorOptions:
    contentPackage:
      name: sample-aem-cms-config
      rootPath: /apps/sample-aem-cms-config/config
      filters:
      - filter: /apps/sample-aem-cms-config

# Apache Sling
- url: mvn:org.apache.sling/org.apache.sling.caconfig.api
  dir: bundles
  condition: ${app.slingModelsLatest}
- url: mvn:org.apache.sling/org.apache.sling.caconfig.spi
  dir: bundles
  condition: ${app.slingModelsLatest}
- url: mvn:org.apache.sling/org.apache.sling.caconfig.impl
  dir: bundles
  condition: ${app.slingModelsLatest}
- url: mvn:org.apache.sling/org.apache.sling.models.caconfig
  dir: bundles
  condition: ${app.slingModelsCaconfig}

# wcm.io
- url: mvn:io.wcm/io.wcm.caconfig.editor
  dir: bundles
- url: mvn:io.wcm/io.wcm.caconfig.extensions
  dir: bundles
- url: mvn:io.wcm/io.wcm.wcm.ui.granite
  dir: bundles
- url: mvn:io.wcm/io.wcm.sling.commons
  dir: bundles

# Application bundles
- url: mvn:io.wcm.samples/io.wcm.caconfig.sample-app.core
  dir: packages

# Application conf content package
- url: mvn:io.wcm.samples/io.wcm.caconfig.sample-app.conf-content//zip
  dir: packages

# Application sample content package
- url: mvn:io.wcm.samples/io.wcm.caconfig.sample-app.sample-content-default//zip
  dir: packages
  condition: ${!app.caconfigAemPagePersistence}
- url: mvn:io.wcm.samples/io.wcm.caconfig.sample-app.sample-content-aempage//zip
  dir: packages
  condition: ${app.caconfigAemPagePersistence}


# Defines configuration parameters and default values
config:
  contentPackage:
    group: wcm-io-samples
    version: ${version}

  app:
    # Whether to use AEM Page persistence strategy
    caconfigAemPagePersistence: true
    # Whether to deploy latest Sling Models API/SPI/Models bundles
    slingModelsLatest: true
    # Whether to deploy bundle org.apache.sling.models.caconfig (not part of AEM out-of-the-box)
    slingModelsCaconfig: true
